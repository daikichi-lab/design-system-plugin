{
  "schema_version": "1.1",
  "name": "mc-01-risk",
  "description": "gold=matrix — docs/canon FP行「リスクの4象限＝matrix」",
  "tags": [
    "matrix-vs-comparison"
  ],
  "runs": 1,
  "execution": {
    "prompt": "あなたは pptx-creation プラグインのスライド構成プランナーです。次の原稿の一文に最適な「構図」を1つ判定してください。\n\n判定基準は、プラグインの deck-strategy スキル（特に Step 3b の保守ゲート：構造を1語で言えなければ図解しない）と、その参照文書 references/graphics/text-to-diagram-examples.md・references/graphics/diagram-recipes.md に従うこと。必要ならスキル・参照文書を読んでよいが、デッキプランは作らない。\n\n文脈: FPセミナー。リスクへの備え方の仕分け。\n原稿の文: 「リスクは、起きる頻度と影響の大きさの2軸で、保険で備えるか貯蓄で備えるかを仕分けます」\n\n出力は次の3行のみ（前置き・後書きは書かない）:\n構造: <構造1語>\n骨格: <パターンID>\n理由: <1行>\n\nパターンIDは次から必ず1つだけ選ぶ（チャートは必ずサブタイプ付きの形で書く）: identity / formula / flow / steps / timeline / cycle / comparison / before-after / positioning / matrix / branch / waterfall / breakeven / system / relation / chart-bar / chart-line / chart-column / chart-band / chart-pie / stat-grid / card-grid / table / message / dialogue / testimonial",
    "max_turns": 10,
    "timeout_seconds": 300,
    "allowed_tools": [
      "Skill",
      "Read",
      "Grep",
      "Glob"
    ]
  },
  "graders": [
    {
      "type": "regex",
      "name": "correct-skeleton",
      "pattern": "骨格[:：]\\s*[`\"'「]?(?:matrix)",
      "match": "contains",
      "weight": 2
    },
    {
      "type": "regex",
      "name": "not-trap",
      "pattern": "骨格[:：]\\s*[`\"'「]?(?:comparison)",
      "match": "not_contains",
      "weight": 1
    },
    {
      "type": "regex",
      "name": "struct-word",
      "pattern": "構造[:：].*(?:2軸|二軸|象限)",
      "match": "contains",
      "weight": 1
    }
  ],
  "expected_outcome": "構造1語=2軸 / 骨格=matrix"
}
